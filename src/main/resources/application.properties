spring.application.name=biblioteca

# Banco H2 em memoria (para desenvolvimento)
spring.datasource.url=jdbc:h2:mem:bibliotecadb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console H2 (acesse em: http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Permite campos int receberem null no JSON (usa 0 como padrão)
spring.jackson.deserialization.fail-on-null-for-primitives=false
